<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b18" />
    <meta
      name="description"
      content="CANDU tactical command deck for steady-state on-power refuelling"
    />
    <title>CANDU / COMMAND DECK</title>
    <style>
      :root { color-scheme: dark; background: #070b1b; }
      html, body, #game-root { width: 100%; height: 100%; margin: 0; }
      html, body { overflow: hidden; background: #070b1b; }
      body { display: block; }
      #game-root {
        display: block;
        position: relative;
        overflow: hidden;
        background: radial-gradient(circle at 50% 42%, #15183b 0%, #0b1026 42%, #070b1b 72%, #030510 100%);
      }
      canvas {
        display: block;
        max-width: 100vw;
        max-height: 100vh;
        touch-action: none;
        box-shadow: 0 0 80px rgb(88 226 223 / 8%), 0 0 0 1px rgb(242 198 109 / 12%);
      }
      #status-mirror { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <div id="status-mirror" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
