name: Deploy CANDU browser playtest

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: candu-playtest-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_CLI_VERSION: 59.11.2
  VERCEL_TELEMETRY_DISABLED: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
          cache: npm
          cache-dependency-path: web/candu-playtest/package-lock.json

      - name: Install frontend dependencies
        working-directory: web/candu-playtest
        run: npm ci

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Install WebAssembly workload
        run: dotnet workload install wasm-tools --skip-manifest-update

      - name: Test authoritative Core and Game
        shell: pwsh
        run: |
          ./tools/Test-DotNet.ps1 -Suite Core
          ./tools/Test-DotNet.ps1 -Suite Game

      - name: Publish authoritative browser bridge
        shell: pwsh
        env:
          BUILD_COMMIT_SHA: ${{ github.sha }}
        run: .\tools\Build-BrowserWasm.ps1 -Configuration Release -CommitSha $env:BUILD_COMMIT_SHA -RunAOTCompilation -OmitPrecompressedAssets

      - name: Verify staged bridge output
        id: staged-wasm
        shell: bash
        run: |
          set -euo pipefail
          wasm_root="web/candu-playtest/public/wasm"
          test -s "$wasm_root/main.mjs"
          wasm_file="$(find "$wasm_root" -type f -name '*.wasm' -print -quit)"
          test -n "$wasm_file"
          test -s "$wasm_root/build-info.json"
          node - "$wasm_root/build-info.json" <<'NODE'
          const fs = require('node:fs');
          const info = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (info.gitCommitSha !== process.env.GITHUB_SHA) throw new Error('build-info.json has the wrong commit SHA');
          if (info.configuration !== 'Release') throw new Error('build-info.json is not a Release build');
          if (info.targetFramework !== 'net10.0' || info.runtimeIdentifier !== 'browser-wasm') {
            throw new Error('build-info.json has the wrong browser target');
          }
          if (info.runAotCompilation !== true || info.omitPrecompressedAssets !== true) {
            throw new Error('build-info.json does not describe the required Release AOT staging configuration');
          }
          NODE
          if find "$wasm_root" -type f \( -name '*.br' -o -name '*.gz' \) -print -quit | grep -q .; then
            echo 'Precompressed .br/.gz assets were staged unexpectedly' >&2
            exit 1
          fi
          wasm_url_path="/${wasm_file#web/candu-playtest/public/}"
          echo "wasm_path=$wasm_url_path" >> "$GITHUB_OUTPUT"
          printf 'Staged bridge: %s\n' "$wasm_file"

      - name: Test browser contract and frontend, then build
        shell: pwsh
        run: ./tools/Test-Browser.ps1

      - name: Install Chromium
        working-directory: web/candu-playtest
        run: npx playwright install --with-deps chromium

      - name: Smoke test the production build before deployment
        working-directory: web/candu-playtest
        env:
          PLAYTEST_URL: http://127.0.0.1:4173
          PLAYTEST_WASM_PATH: ${{ steps.staged-wasm.outputs.wasm_path }}
          PLAYTEST_CAPTURE_DIR: ${{ github.workspace }}/artifacts/predeploy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PLAYTEST_CAPTURE_DIR"
          npm run preview -- --configLoader runner --host 127.0.0.1 --port 4173 --strictPort > "$PLAYTEST_CAPTURE_DIR/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent "$PLAYTEST_URL" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$PLAYTEST_URL" > /dev/null
          npm run smoke 2>&1 | tee "$PLAYTEST_CAPTURE_DIR/smoke.log"

      - name: Save validated authoritative bridge
        uses: actions/upload-artifact@v4
        with:
          name: validated-wasm
          path: web/candu-playtest/public/wasm
          if-no-files-found: error
          retention-days: 7

      - name: Save validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-diagnostics
          path: artifacts/predeploy
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
          cache: npm
          cache-dependency-path: web/candu-playtest/package-lock.json

      - name: Install frontend dependencies
        working-directory: web/candu-playtest
        run: npm ci

      - name: Restore validated authoritative bridge
        uses: actions/download-artifact@v4
        with:
          name: validated-wasm
          path: web/candu-playtest/public/wasm

      - name: Install Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Link Vercel project
        working-directory: web/candu-playtest
        run: vercel link --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" --project "$VERCEL_PROJECT_ID"

      - name: Pull Vercel production configuration
        working-directory: web/candu-playtest
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build Vercel production output
        working-directory: web/candu-playtest
        run: vercel build --prod --token "$VERCEL_TOKEN"

      - name: Verify Vercel output contains the bridge
        id: vercel-output
        working-directory: web/candu-playtest
        shell: bash
        run: |
          set -euo pipefail
          main_asset="$(find .vercel/output -type f -path '*/wasm/main.mjs' -print -quit)"
          wasm_asset="$(find .vercel/output -type f -name '*.wasm' -print -quit)"
          test -n "$main_asset"
          test -n "$wasm_asset"
          test -s "$main_asset"
          test -s "$wasm_asset"
          node - "$main_asset" <<'NODE'
          const fs = require('node:fs');
          const content = fs.readFileSync(process.argv[2], 'utf8').trimStart();
          if (content.startsWith('<')) throw new Error('Vercel output rewrote main.mjs to HTML');
          NODE
          case "$wasm_asset" in
            .vercel/output/static/*) wasm_url_path="/${wasm_asset#.vercel/output/static/}" ;;
            .vercel/output/*) wasm_url_path="/${wasm_asset#.vercel/output/}" ;;
            *) echo "Unexpected Vercel output path: $wasm_asset" >&2; exit 1 ;;
          esac
          echo "wasm_path=$wasm_url_path" >> "$GITHUB_OUTPUT"
          printf 'Vercel bridge assets: %s and %s\n' "$main_asset" "$wasm_asset"

      - name: Deploy prebuilt production output
        id: deploy
        working-directory: web/candu-playtest
        shell: bash
        run: |
          set -euo pipefail
          deploy_url="$(vercel deploy --prebuilt --prod --archive=tgz --token "$VERCEL_TOKEN")"
          test -n "$deploy_url"
          echo "url=$deploy_url" >> "$GITHUB_OUTPUT"
          printf 'Production deployment: %s\n' "$deploy_url"

      - name: Install Chromium for post-deployment smoke test
        working-directory: web/candu-playtest
        run: npx playwright install --with-deps chromium

      - name: Smoke test authoritative bridge
        working-directory: web/candu-playtest
        env:
          PLAYTEST_CAPTURE_DIR: ${{ github.workspace }}/artifacts/postdeploy
          PLAYTEST_URL: https://crs-candu-playtest.vercel.app
          PLAYTEST_WASM_PATH: ${{ steps.vercel-output.outputs.wasm_path }}
        run: |
          mkdir -p "$PLAYTEST_CAPTURE_DIR"
          set -o pipefail
          npm run smoke 2>&1 | tee "$PLAYTEST_CAPTURE_DIR/smoke.log"

      - name: Benchmark authoritative reproduction matrix
        working-directory: web/candu-playtest
        env:
          PLAYTEST_CAPTURE_DIR: ${{ github.workspace }}/artifacts/postdeploy
          PLAYTEST_URL: https://crs-candu-playtest.vercel.app
          PLAYTEST_EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p "$PLAYTEST_CAPTURE_DIR"
          set -o pipefail
          npm run benchmark -- --label=stable --warm-samples=1 2>&1 | tee "$PLAYTEST_CAPTURE_DIR/benchmark.log"

      - name: Save deployed diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-diagnostics
          path: artifacts/postdeploy
          if-no-files-found: ignore
          retention-days: 7

  pages-build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
          cache: npm
          cache-dependency-path: web/candu-playtest/package-lock.json
      - run: npm ci
        working-directory: web/candu-playtest
      - name: Restore validated authoritative bridge
        uses: actions/download-artifact@v4
        with:
          name: validated-wasm
          path: web/candu-playtest/public/wasm
      - name: Build GitHub Pages site
        working-directory: web/candu-playtest
        run: npm run build -- --base /CRS/ --outDir dist-pages
      - name: Install Chromium
        working-directory: web/candu-playtest
        run: npx playwright install --with-deps chromium
      - name: Smoke test the Pages subpath before deployment
        working-directory: web/candu-playtest
        env:
          PLAYTEST_URL: http://127.0.0.1:4173/CRS/
          PLAYTEST_CAPTURE_DIR: ${{ github.workspace }}/artifacts/pages-predeploy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PLAYTEST_CAPTURE_DIR"
          npm run preview -- --outDir dist-pages --base /CRS/ --host 127.0.0.1 --port 4173 --strictPort > "$PLAYTEST_CAPTURE_DIR/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent "$PLAYTEST_URL" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$PLAYTEST_URL" > /dev/null
          npm run smoke 2>&1 | tee "$PLAYTEST_CAPTURE_DIR/smoke.log"
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/candu-playtest/dist-pages
      - name: Save Pages validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-validation-diagnostics
          path: artifacts/pages-predeploy
          if-no-files-found: ignore

  deploy-pages:
    needs: pages-build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy validated GitHub Pages site
        id: pages
        uses: actions/deploy-pages@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
      - run: npm ci
        working-directory: web/candu-playtest
      - run: npx playwright install --with-deps chromium
        working-directory: web/candu-playtest
      - name: Verify published Pages game and commit
        working-directory: web/candu-playtest
        env:
          PLAYTEST_URL: ${{ steps.pages.outputs.page_url }}
          PLAYTEST_EXPECTED_COMMIT_SHA: ${{ github.sha }}
          PLAYTEST_CAPTURE_DIR: ${{ github.workspace }}/artifacts/pages-postdeploy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PLAYTEST_CAPTURE_DIR"
          npm run smoke 2>&1 | tee "$PLAYTEST_CAPTURE_DIR/smoke.log"
          npm run benchmark -- --label=github-pages --warm-samples=1 2>&1 | tee "$PLAYTEST_CAPTURE_DIR/benchmark.log"
      - name: Save Pages deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-deployment-diagnostics
          path: artifacts/pages-postdeploy
          if-no-files-found: ignore
