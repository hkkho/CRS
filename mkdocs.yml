site_name: CRS Documentation
site_description: Player manual, reactor theory and a walkthrough of the shared CANDU simulation
site_url: https://hkkho.github.io/CRS/docs/
repo_url: https://github.com/hkkho/CRS
docs_dir: docs/code-library
site_dir: artifacts/code-library
use_directory_urls: true
theme:
  name: material
  font: false
  palette:
    scheme: default
    primary: indigo
  features:
    - navigation.sections
    - navigation.footer
    - search.highlight
plugins:
  - search
hooks:
  - tools/docs/annotated_source.py
  - tools/docs/repository_links.py
extra_css:
  - stylesheets/library.css
markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
validation:
  links:
    anchors: warn
nav:
  - Documentation: index.md
  - Player manual:
      - Overview: manual/index.md
      - Quick start: manual/start.md
      - Fuelling: manual/fuel.md
      - Maps and readings: manual/physics.md
      - Limits and score: manual/score.md
  - Reactor theory:
      - Overview: theory/index.md
      - Solver and power: theory/numerical-model.md
      - Fuel and burnup: theory/fuel.md
      - Poison and regulation: theory/regulation.md
  - Code walkthrough:
      - 1. Entry points and startup: 01-startup.md
      - 2. Browser commands and transport: 02-browser-transport.md
      - 3. One time-based step: 03-daily-turn.md
      - 4. Core state and physics: 04-core-physics.md
      - 5. Snapshots and presentation: 05-presentation.md
      - 6. Checkpoints and updates: 06-saves-lifecycle.md
      - 7. Build, tests and documentation: 07-development.md
  - Play CRS: https://hkkho.github.io/CRS/
